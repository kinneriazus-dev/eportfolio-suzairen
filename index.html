const COMPS=[{"number":1,"title":"Customer Oriented","count":17,"entries":[{"id":"1a","text":"Memastikan kelancaran pengurusan dan penyampaian perkhidmatan pelanggan di PSP Dungun meliputi urusan tuntutan faedah di bawah Akta 4, Akta 789, Akta 800 dan Akta 838 serta pendaftaran majikan, pekerja dan Orang Bekerja Sendiri mengikut prosedur dan piagam pelanggan yang ditetapkan."},{"id":"1b","text":"Memberikan layanan yang mesra, profesional, responsif dan berhemah kepada pelanggan dalaman serta luaran dengan memastikan setiap pertanyaan, aduan dan permasalahan diberikan perhatian serta tindakan susulan yang bersesuaian."},{"id":"1c","text":"Memastikan pelanggan yang hadir ke kaunter PSP Dungun memperoleh penerangan yang jelas dan tepat mengenai kelayakan faedah, prosedur tuntutan, dokumen sokongan, pendaftaran caruman serta perkhidmatan pemulihan PERKESO."},{"id":"1d","text":"Membantu melancarkan urusan pendaftaran tuntutan faedah, pendaftaran majikan dan pekerja serta pengendalian kaunter apabila berlaku kekurangan anggota atau keperluan perkhidmatan yang mendesak bagi memastikan kesinambungan operasi pejabat."},{"id":"1e","text":"Mengawal selia dan memantau urusan permohonan alatan pemulihan, dialisis, Bayaran Ganti Belanja (BGB) dan tuntutan perubatan supaya dilaksanakan mengikut prosedur, bidang kuasa dan tempoh KPI yang ditetapkan."},{"id":"1f","text":"Menyokong pelaksanaan Program Skuad PERKESO Prihatin, Social Synergy dan Ziarah Prihatin bagi memastikan golongan yang memerlukan bantuan, perlindungan sosial dan perhatian khusus memperoleh perkhidmatan serta tindakan yang sewajarnya."},{"id":"1g","text":"Memastikan pengurusan program Sinergi PSP Dungun mencapai sasaran organisasi dengan merekodkan 207 aktiviti berbanding sasaran 199 aktiviti, bersamaan pencapaian 104.02% sehingga 31 Oktober 2026."},{"id":"1h","text":"Memberikan kerjasama dalam pelaksanaan Program Outreach Bersama Belia dengan kerjasama NADI dan PERKESO pada 6 Februari 2026 di NADI Kampung Pasir Raja, Dungun bagi memperluas penyampaian maklumat perlindungan keselamatan sosial kepada masyarakat setempat."},{"id":"1i","text":"Membantu menjayakan pembukaan kaunter pendaftaran Skim Keselamatan Sosial Pekerjaan Sendiri atau LINDUNG Kendiri sempena Mini Race Dungun Escapade pada 17 April 2026 bagi memudahkan peserta memperoleh penerangan dan perkhidmatan pendaftaran PERKESO."},{"id":"1j","text":"Menjalinkan hubungan kerja yang baik dengan majikan, agensi kerajaan, komuniti setempat dan pihak berkepentingan bagi membantu pelanggan mendapatkan maklumat, khidmat nasihat dan perkhidmatan perlindungan sosial yang bersesuaian."},{"id":"1k","text":"Memberikan tunjuk ajar, panduan dan bantuan kepada anggota lain dalam menyelesaikan permasalahan pelanggan, khususnya urusan tuntutan faedah, pendaftaran dan pemulihan supaya kes tidak tertangguh disebabkan kekurangan maklumat atau ketidakjelasan prosedur."},{"id":"1l","text":"Mengambil perhatian terhadap maklum balas pelanggan dan kualiti penyampaian perkhidmatan PSP Dungun, termasuk penarafan Google Review sebanyak 4.5 daripada 5 bintang berdasarkan 43 ulasan, sebagai salah satu indikator maklum balas awam terhadap perkhidmatan pejabat."},{"id":"1m","text":"Membudayakan konsep PERKESO Prihatin dengan mengutamakan kepentingan pelanggan, memastikan maklumat yang disampaikan adalah tepat dan mengambil inisiatif membantu menyelesaikan urusan pelanggan secara cekap, adil dan bertanggungjawab."},{"id":"1n","text":"Membantu menyemak serta menguruskan 350 rekod surat pengesahan kod majikan atau surat projek bagi kawasan Dungun untuk memastikan majikan memperoleh pengesahan dan maklumat yang diperlukan bagi urusan berkaitan."},{"id":"1o","text":"Mengamalkan pendekatan perkhidmatan yang responsif dengan memberikan bantuan dan maklum balas kepada pelanggan dalaman serta luaran di luar waktu urusan kaunter apabila keadaan memerlukan tindakan segera dan bersesuaian dengan tanggungjawab yang diamanahkan."},{"id":"1p","text":"Membantu mengenal pasti keperluan Orang Berinsurans dan pelanggan yang memerlukan perkhidmatan daripada agensi lain serta memberikan panduan atau rujukan kepada pihak berkaitan mengikut kelayakan, prosedur dan bidang kuasa."},{"id":"1q","text":"Mengambil inisiatif memberikan perhatian awal terhadap kejadian musibah atau bencana yang melibatkan Orang Berinsurans berdasarkan maklumat yang diterima, termasuk laporan media, bagi mengenal pasti keperluan tindakan dan bantuan sebelum proses tuntutan rasmi dimulakan."}]},{"number":2,"title":"Communication","count":16,"entries":[{"id":"2a","text":"Menggunakan pelbagai medium komunikasi seperti emel rasmi, telefon, WhatsApp, Facebook dan saluran komunikasi digital bagi mempercepatkan penyampaian maklumat serta meningkatkan keberkesanan urusan bersama pelanggan dalaman dan luaran."},{"id":"2b","text":"Menyampaikan arahan, maklumat operasi, perubahan prosedur, perkembangan kerja dan ketetapan pengurusan kepada anggota PSP Dungun secara jelas supaya setiap tanggungjawab dapat difahami serta dilaksanakan dengan teratur."},{"id":"2c","text":"Mengadakan perbincangan bersama rakan sekerja dan anggota bawahan mengenai permasalahan pengoperasian, pencapaian KPI, pengagihan tugasan serta cadangan penambahbaikan bagi memastikan kelancaran perkhidmatan pejabat."},{"id":"2d","text":"Berkomunikasi secara berterusan dengan pegawai PPN Terengganu, Pejabat PERKESO Kemaman, Ibu Pejabat dan bahagian berkaitan dalam menyelaraskan pengurusan kes faedah, pemulihan, pengoperasian serta pentadbiran PSP Dungun."},{"id":"2e","text":"Menggunakan pendekatan komunikasi yang bersesuaian untuk mendapatkan maklum balas dan penyelesaian terhadap permasalahan teknikal, gangguan sistem, peralatan komputer serta kemudahan pejabat melalui pihak ICT dan unit yang bertanggungjawab."},{"id":"2f","text":"Berkongsi maklumat berkaitan faedah, skim perlindungan keselamatan sosial, program dan aktiviti PERKESO melalui Facebook serta media sosial yang bersesuaian bagi meningkatkan kesedaran masyarakat tentang kepentingan perlindungan keselamatan sosial."},{"id":"2g","text":"Menggunakan kemahiran komunikasi secara bersemuka dan digital dalam pelaksanaan program advokasi, taklimat serta sesi libat urus bersama majikan, komuniti dan agensi luar sepanjang tahun 2026."},{"id":"2h","text":"Menjalinkan hubungan komunikasi dan kerjasama dengan agensi luar seperti Jabatan Tenaga Kerja, institusi kesihatan, agensi kebajikan dan pihak berkepentingan bagi memudahkan penyelarasan urusan pelanggan serta penyampaian maklumat perkhidmatan PERKESO."},{"id":"2i","text":"Mengamalkan komunikasi yang jelas, berhemah dan profesional dengan menerapkan budaya S4P, ECG serta Nilai Teras Bersama PERKESO ketika berurusan dengan pelanggan, majikan, rakan sekerja dan pihak pengurusan."},{"id":"2j","text":"Menggalakkan anggota menyertai program pembangunan kompetensi, kursus, latihan, pertandingan dan aktiviti organisasi melalui penyampaian maklumat berkaitan peluang penyertaan, syarat, keperluan serta tarikh akhir yang ditetapkan."},{"id":"2k","text":"Menggunakan kemahiran komunikasi dan penyampaian maklumat dalam membantu menyelaraskan aktiviti KESPERT, termasuk Program Fit-Tober 2.0, Briskwalk PSP 2.0 serta program kebajikan dan kesukanan anjuran PERKESO Negeri Terengganu."},{"id":"2l","text":"Bertindak sebagai pentadbir dan penyelaras komunikasi bagi kumpulan WhatsApp kerja seperti Pegawai Pemulihan PERKESO, Dialisis PERKESO, Perubatan dan Pemulihan, PSP Dungun serta Urus Setia JD/JDK/JDR SOCSO bagi memudahkan perkongsian maklumat dan penyelarasan tugasan."},{"id":"2m","text":"Menggunakan saluran media sosial seperti Facebook dan TikTok bagi berkongsi maklumat berkaitan skim perlindungan, faedah, program serta aktiviti PERKESO melalui platform yang dikendalikan atau digunakan dalam hebahan organisasi."},{"id":"2n","text":"Menjalankan peranan sebagai PERKESO Change Agent (073) di Dungun, Terengganu dengan membantu penyampaian maklumat, perubahan dan inisiatif organisasi antara pihak pengurusan dengan anggota pejabat."},{"id":"2o","text":"Melaksanakan perkongsian ilmu dan maklumat berkaitan perlindungan keselamatan sosial kepada rakan, ahli keluarga dan komuniti termasuk memberikan penerangan mengenai SKSSR serta SKSPS bagi meningkatkan kesedaran tentang kepentingan mencarum."},{"id":"2p","text":"Mengekalkan komunikasi kerja dengan pegawai agensi luar, termasuk Jabatan Tenaga Kerja dan Unit Kerja Sosial Hospital Dungun, bagi memudahkan urusan pertanyaan, penyelarasan maklumat dan tindakan berkaitan pelanggan PERKESO."}]},{"number":3,"title":"Team Work","count":14,"entries":[{"id":"3a","text":"Memberikan kerjasama sepenuhnya kepada anggota PSP Dungun, PPN Terengganu dan bahagian berkaitan dalam memastikan kelancaran pengurusan tuntutan faedah, pendaftaran majikan dan pekerja serta penyampaian perkhidmatan pelanggan."},{"id":"3b","text":"Bekerjasama dengan pegawai pengoperasian dan pasukan Sinergi dalam melaksanakan Program Skuad PERKESO Prihatin, Social Synergy dan Ziarah Prihatin sehingga PSP Dungun berjaya mencapai 104.02% sasaran aktiviti pada 31 Oktober 2026."},{"id":"3c","text":"Memberikan kerjasama dalam pelaksanaan aktiviti pencegahan bencana kerja dan Ops Cegah 2026 yang menyumbang kepada pencapaian penuh 5.00 markah daripada 5.00 markah wajaran bagi PP Dungun."},{"id":"3d","text":"Melibatkan diri dalam Ops Lebihan Bayaran PPN Terengganu dan PSP Dungun pada 15 September 2026 melalui penyelarasan tugasan serta kerjasama anggota yang terlibat dalam memastikan pelaksanaan operasi berjalan lancar."},{"id":"3e","text":"Bekerjasama menjayakan Program Outreach Bersama Belia dengan kerjasama NADI dan PERKESO pada 6 Februari 2026 di Kampung Pasir Raja, Dungun sebagai usaha memperluas advokasi perlindungan keselamatan sosial."},{"id":"3f","text":"Memberikan kerjasama dalam pelaksanaan kaunter pendaftaran PERKESO sempena Mini Race Dungun Escapade pada 17 April 2026 bagi menyediakan perkhidmatan pendaftaran serta penerangan kepada kumpulan sasaran."},{"id":"3g","text":"Melibatkan diri dalam Program CSR dan Jalinan Mesra Bersama Media Negeri Terengganu 2026 sebagai ahli jawatankuasa yang dilantik serta memberikan sokongan dalam pelaksanaan tugas bagi menjayakan program."},{"id":"3h","text":"Memberikan kerjasama dalam menjayakan Sambutan Hari PERKESO Ke-55 Peringkat Negeri Terengganu melalui penglibatan sebagai juri Pertandingan Battle of Style serta menyokong pelaksanaan aktiviti organisasi."},{"id":"3i","text":"Bekerjasama dengan jawatankuasa penganjur Program Family Day PERKESO Negeri Terengganu pada 3 hingga 4 Julai 2026 bagi membantu melancarkan penganjuran aktiviti kebajikan, kekeluargaan dan kesukanan anggota."},{"id":"3j","text":"Bekerjasama dengan pasukan penganjur Program Fit-Tober 2.0 sepanjang Oktober 2026 melalui pelantikan sebagai Ketua AJK Teknikal dan Dokumentasi, termasuk membantu penyelarasan maklumat serta keperluan teknikal program."},{"id":"3k","text":"Membantu menjayakan Program Briskwalk PSP 2.0 pada 26 September 2026 melalui pelantikan sebagai Penolong Penyelaras serta memberikan kerjasama dalam perancangan, persediaan dan pengendalian program."},{"id":"3l","text":"Mengamalkan semangat kerja berpasukan, saling membantu dan berkongsi pengetahuan serta pengalaman bersama rakan sekerja bagi memastikan permasalahan pengoperasian, pemulihan dan urusan kaunter dapat ditangani secara kolektif."},{"id":"3m","text":"Bekerjasama dengan Cawangan Pemulihan dalam menyemak dan menangani permasalahan tuntutan Bayaran Ganti Belanja melalui sistem INSPIRE, termasuk isu berkaitan pemprosesan dan pembayaran tuntutan yang memerlukan tindakan antara unit."},{"id":"3n","text":"Memberikan kerjasama kepada Cawangan Faedah dalam membantu penyelarasan serta penyelesaian kes tuntutan semasa dan tertunggak di peringkat Pejabat Sokongan dan Pusat Satelit bagi memastikan kelancaran urusan pelanggan."}]},{"number":4,"title":"Integrity & Discipline","count":19,"entries":[{"id":"4a","text":"Sentiasa mematuhi peraturan, pekeliling, arahan pentadbiran dan prosedur kerja yang ditetapkan oleh PERKESO dalam melaksanakan tanggungjawab rasmi sebagai Ketua PSP Dungun."},{"id":"4b","text":"Mengutamakan integriti, ketelusan dan akauntabiliti dalam setiap urusan pendaftaran, tuntutan faedah, pembayaran, pengurusan dokumen serta pentadbiran pejabat bagi memastikan pelaksanaan tugas berlandaskan tatacara yang ditetapkan."},{"id":"4c","text":"Menjaga kerahsiaan maklumat rasmi organisasi, rekod majikan, pekerja dan Orang Berinsurans serta memastikan maklumat yang diperoleh melalui pelaksanaan tugas tidak didedahkan atau disalahgunakan."},{"id":"4d","text":"Memberikan komitmen kerja yang tinggi dalam memastikan kelancaran operasi PSP Dungun, pelaksanaan tugasan serta pemantauan pencapaian sasaran kerja mengikut tempoh yang ditetapkan."},{"id":"4e","text":"Memastikan tindakan berkaitan pengurusan tuntutan faedah, Bayaran Ganti Belanja, permohonan alatan pemulihan dan perkhidmatan pemulihan dilaksanakan berdasarkan peraturan, prosedur serta bidang kuasa yang dibenarkan."},{"id":"4f","text":"Memberikan perhatian terhadap pengurusan risiko dan pematuhan prosedur keselamatan pejabat, termasuk kawalan akses ruang terhad, keselamatan bilik server, perlindungan aset serta penyelenggaraan kemudahan pejabat."},{"id":"4g","text":"Melaksanakan tindakan susulan terhadap penemuan audit PSP Dungun secara bertanggungjawab dengan mengenal pasti isu, menyediakan penjelasan dan mengemukakan cadangan tindakan pembetulan serta penambahbaikan kepada pihak berkaitan."},{"id":"4h","text":"Menjaga imej dan reputasi PERKESO melalui penampilan profesional, pematuhan etika berpakaian, komunikasi berhemah serta tingkah laku positif ketika berurusan dengan pelanggan, majikan dan agensi luar."},{"id":"4i","text":"Memberikan perhatian terhadap ketepatan rekod, pengurusan dokumen rasmi, pematuhan tatacara kewangan, kawalan aset dan penyimpanan maklumat pejabat mengikut prosedur yang berkuat kuasa."},{"id":"4j","text":"Menghadiri program, perhimpunan dan mesyuarat rasmi organisasi serta mengambil maklum arahan, dasar dan perkembangan semasa PERKESO bagi memastikan pengurusan pejabat selaras dengan ketetapan pihak pengurusan."},{"id":"4k","text":"Mengamalkan pembelajaran berterusan melalui penyertaan dalam program pendidikan dan pembangunan kompetensi seperti CDME, webinar kesihatan pekerjaan serta program kesedaran keselamatan organisasi bagi meningkatkan pengetahuan dan profesionalisme kerja."},{"id":"4l","text":"Memberikan perhatian terhadap pelaksanaan arahan pihak pengurusan dan berusaha memastikan setiap tanggungjawab yang diamanahkan dilaksanakan dengan penuh disiplin, amanah, kejujuran serta profesionalisme."},{"id":"4m","text":"Mengekalkan rekod kecemerlangan kehadiran dan komitmen kerja melalui pencapaian Sijil SSP Tanpa Cuti Sakit bagi tahun-tahun yang dinyatakan dalam rekod peribadi, termasuk 2011 hingga 2019 serta 2021 hingga 2026."},{"id":"4n","text":"Mengutamakan ketepatan masa melalui amalan hadir lebih awal ke tempat kerja bagi memastikan persediaan operasi harian dan penyampaian perkhidmatan PSP Dungun dapat dilaksanakan dengan teratur."},{"id":"4o","text":"Menunjukkan komitmen dalam menyelesaikan tugasan yang mendesak melalui kesediaan membantu urusan rasmi di luar waktu pejabat, termasuk pada hari minggu atau cuti umum apabila keperluan organisasi memerlukan."},{"id":"4p","text":"Mengutamakan kepentingan organisasi dengan menyesuaikan perancangan cuti rehat apabila terdapat program atau keperluan operasi penting yang memerlukan penglibatan dan tanggungjawab secara langsung."},{"id":"4q","text":"Melaksanakan pembelajaran kendiri dan pembangunan kompetensi melalui Xpert Learning Portal serta platform pembelajaran organisasi yang berkaitan bagi memastikan pengetahuan dan kemahiran kerja sentiasa dipertingkatkan."},{"id":"4r","text":"Mengekalkan pematuhan terhadap peraturan dan etika perkhidmatan serta berusaha memastikan setiap tindakan dan tingkah laku sepanjang menjalankan tugas tidak menjejaskan disiplin, reputasi dan kepentingan PERKESO."},{"id":"4s","text":"Memberikan keutamaan kepada penyampaian maklum balas yang cepat dan tepat kepada Pengarah Negeri serta pihak pengurusan bagi perkara yang memerlukan perhatian, keputusan atau tindakan segera."}]},{"number":5,"title":"Team Lead","count":15,"entries":[{"id":"5a","text":"Melaksanakan tanggungjawab sebagai Ketua Pusat Satelit PERKESO Dungun dengan menyelia pengoperasian pejabat, mengawal selia penyampaian perkhidmatan pelanggan serta memastikan sasaran kerja dan KPI organisasi diberi perhatian secara berterusan."},{"id":"5b","text":"Menyelaras pembahagian tugasan anggota PSP Dungun berdasarkan keperluan operasi, keutamaan kerja, kemampuan anggota dan jumlah tugasan bagi memastikan urusan kaunter, pendaftaran, tuntutan faedah serta perkhidmatan pemulihan berjalan lancar."},{"id":"5c","text":"Memberikan tunjuk ajar, bimbingan dan penerangan kepada anggota melalui kaedah penerangan, demonstrasi, pemantauan dan latihan silang tugas bagi meningkatkan kemahiran serta memastikan tugasan dilaksanakan mengikut prosedur kerja yang ditetapkan."},{"id":"5d","text":"Memantau pelaksanaan aktiviti Sinergi pejabat sehingga mencapai 207 aktiviti berbanding sasaran 199 aktiviti, iaitu pencapaian 104.02% sehingga 31 Oktober 2026."},{"id":"5e","text":"Memberikan kepimpinan dan kerjasama dalam pelaksanaan aktiviti pencegahan bencana kerja serta Ops Cegah 2026 yang menunjukkan pencapaian penuh KPI Pencegahan berdasarkan dashboard pengoperasian PERKESO."},{"id":"5f","text":"Mengetuai Kumpulan 12 dalam pelaksanaan Ops Lebihan Bayaran PPN Terengganu dan PSP Dungun pada 15 September 2026 bagi membantu menyelaras tugasan serta pelaksanaan tindakan operasi bersama anggota terlibat."},{"id":"5g","text":"Dilantik sebagai Ketua AJK Logistik bagi Majlis Persaraan Hajah Farihah Binti Che Husin pada 7 Julai 2026 serta membantu menyelaras persediaan, keperluan peralatan dan urusan logistik program."},{"id":"5h","text":"Dilantik sebagai Ketua AJK Teknikal dan Dokumentasi bagi Program Fit-Tober 2.0 KESPERT Negeri Terengganu 2026 yang berlangsung sepanjang Oktober 2026, melibatkan penyelarasan keperluan teknikal, dokumentasi dan maklumat program."},{"id":"5i","text":"Dilantik sebagai Penolong Penyelaras Program Briskwalk PSP 2.0 pada 26 September 2026 dan membantu penyelaras utama dalam perancangan, persediaan serta pengendalian aktiviti yang melibatkan anggota pejabat."},{"id":"5j","text":"Menggalakkan budaya kerja berpasukan, penyertaan anggota dalam program organisasi, perkongsian pengetahuan, pembangunan kemahiran serta penambahbaikan prestasi bagi membentuk pasukan yang produktif, berdaya saing dan berdisiplin."},{"id":"5k","text":"Memberikan penglibatan dalam Jawatankuasa Pengurusan Dalaman peringkat PPN Terengganu dan PSP Dungun bagi membantu membincangkan isu operasi, mengemukakan pandangan serta menyokong penyelarasan keputusan dan tindakan pengurusan pejabat."},{"id":"5l","text":"Mewakili PERKESO Dungun sebagai pegawai yang terlibat dalam **sesi penerangan Skim Kemalangan Bukan Bencana Kerja (SKBBK) atau Skim LINDUNG 24 Jam** kepada pekerja Rohana Nursery & Trading Sdn. Bhd. pada **28 Julai 2026**, sebagai usaha membantu pekerja memahami pelaksanaan serta kepentingan perlindungan keselamatan sosial."},{"id":"5m","text":"Mewakili PSP Dungun dalam urusan **jemputan taklimat di KWSP Dungun pada 14 September 2026**, termasuk membuat pengesahan kehadiran pihak PERKESO dan menyelaras komunikasi dengan penganjur bagi memastikan persediaan penyampaian maklumat perlindungan sosial dapat dilaksanakan dengan teratur."},{"id":"5n","text":"Mengambil perhatian terhadap permohonan dan jemputan sesi taklimat perlindungan keselamatan sosial daripada majikan, termasuk **Dipetro Synergy Eng Sdn. Bhd. dan The Qamar Paka**, bagi menyokong perancangan penyampaian maklumat berkaitan Skim LINDUNG 24 Jam kepada pihak pengurusan dan pekerja."},{"id":"5o","text":"Menggunakan keupayaan kepimpinan dan penyampaian ilmu dalam menyokong program advokasi seperti **Outreach Bersama Belia NADI, Mini Race Dungun Escapade serta taklimat kepada majikan dan komuniti**, termasuk membantu penyelarasan penerangan, penglibatan anggota dan urusan pendaftaran bagi memperluas kefahaman masyarakat terhadap skim perlindungan PERKESO."}]},{"number":6,"title":"Decision Making","count":14,"entries":[{"id":"6a","text":"Membuat pertimbangan dan keputusan secara objektif dalam menguruskan pengoperasian harian PSP Dungun berdasarkan fakta, keperluan perkhidmatan, maklumat tersedia serta peraturan dan arahan yang ditetapkan."},{"id":"6b","text":"Memastikan keputusan berkaitan pengendalian tuntutan faedah, pendaftaran majikan dan pekerja, perkhidmatan pemulihan serta urusan pelanggan dibuat berdasarkan akta, peraturan, pekeliling, prosedur dan bidang kuasa yang diberikan."},{"id":"6c","text":"Menilai keperluan pengagihan tugas anggota serta menentukan keutamaan kerja berdasarkan jumlah tugasan, beban kerja, tempoh penyelesaian, kemampuan anggota dan keperluan kesinambungan operasi pejabat."},{"id":"6d","text":"Membuat pertimbangan dalam menyelesaikan permasalahan pelanggan dengan menentukan tindakan susulan yang bersesuaian, termasuk merujuk kes kepada pejabat sokongan atau bahagian berkaitan apabila memerlukan semakan atau keputusan lanjut."},{"id":"6e","text":"Memberikan pandangan dan cadangan kepada rakan sekerja berkaitan pengendalian kes ragu, permasalahan operasi, tuntutan faedah serta perkhidmatan pemulihan berdasarkan prosedur dan maklumat yang tersedia."},{"id":"6f","text":"Memantau pencapaian KPI pejabat dan menentukan keutamaan tindakan susulan sekiranya berlaku kelewatan, gangguan sistem, masalah teknikal atau isu yang berpotensi menjejaskan pencapaian sasaran kerja organisasi."},{"id":"6g","text":"Membuat pertimbangan terhadap isu penyelenggaraan bangunan, keselamatan ruang pejabat dan keperluan kemudahan dengan mengambil kira tahap risiko, keselamatan anggota, keperluan pelanggan serta penyelesaian yang boleh dilaksanakan di peringkat pejabat."},{"id":"6h","text":"Menilai penemuan audit PSP Dungun dan menentukan cadangan tindakan pembetulan, langkah kawalan sementara serta perkara yang perlu dirujuk kepada pihak pengurusan bagi mendapatkan kelulusan atau tindakan lanjut."},{"id":"6i","text":"Mempertimbangkan beberapa alternatif penyelesaian serta mendapatkan pandangan daripada pegawai yang mempunyai kepakaran sebelum membuat keputusan atau mengemukakan cadangan terhadap permasalahan yang rumit."},{"id":"6j","text":"Mengamalkan pendekatan perbincangan dan rundingan bersama anggota serta pegawai berkaitan bagi memastikan keputusan yang dibuat adalah realistik, berasaskan maklumat yang mencukupi dan selaras dengan kepentingan organisasi."},{"id":"6k","text":"Membuat pertimbangan terhadap keperluan dan kelayakan Orang Berinsurans atau pelanggan untuk mendapatkan bantuan daripada agensi lain serta menentukan bentuk rujukan yang bersesuaian berdasarkan maklumat dan bidang kuasa yang tersedia."},{"id":"6l","text":"Memastikan isu pencapaian KPI yang tidak mencapai sasaran atau berisiko lewat dimaklumkan kepada pihak berkaitan, khususnya apabila melibatkan gangguan teknikal dalam proses pemulihan seperti issuing, receiving dan approval supaya tindakan pembetulan dapat dipertimbangkan."},{"id":"6m","text":"Memberikan input dan pertimbangan dalam mesyuarat yang dihadiri dengan menilai maklumat, pandangan ahli mesyuarat serta kesan keputusan terhadap operasi sebelum menyokong cadangan tindakan bersama."},{"id":"6n","text":"Memberikan pandangan dan nasihat dalam pengendalian kes ragu yang dihadapi pegawai Sinergi dan Pemulihan bagi membantu menentukan tindakan susulan berdasarkan fakta kes, prosedur dan keperluan rujukan kepada pihak yang mempunyai bidang kuasa."}]},{"number":7,"title":"Problem Solving & Analytical Thinking","count":17,"entries":[{"id":"7a","text":"Mengenal pasti, menilai dan menganalisis permasalahan pengoperasian PSP Dungun secara sistematik dengan mengambil kira punca masalah, tahap risiko, implikasi terhadap penyampaian perkhidmatan serta tindakan penyelesaian yang bersesuaian."},{"id":"7b","text":"Menyemak dan menganalisis pencapaian KPI pejabat melalui dashboard pengoperasian PERKESO serta laporan statistik bagi mengenal pasti tahap pencapaian, kelewatan dan perkara yang memerlukan tindakan penambahbaikan."},{"id":"7c","text":"Membantu merancang, menyelaras dan memantau pelaksanaan aktiviti Sinergi sehingga PSP Dungun berjaya mencapai 207 aktiviti berbanding sasaran 199 aktiviti, bersamaan 104.02% sehingga 31 Oktober 2026."},{"id":"7d","text":"Memantau pencapaian aktiviti Pencegahan dan Ops Cegah yang merekodkan pencapaian 100% serta 5.00 markah daripada 5.00 markah wajaran bagi PP Dungun pada tahun 2026."},{"id":"7e","text":"Mengambil pendekatan proaktif dalam mengenal pasti isu yang berpotensi menjejaskan penyampaian perkhidmatan kaunter, pendaftaran tuntutan faedah, pengurusan pemulihan dan penyelesaian kes supaya tindakan awal dapat diambil bagi mengurangkan gangguan operasi."},{"id":"7f","text":"Menganalisis permasalahan berkaitan sistem pengoperasian termasuk pendaftaran, pembayaran, pengemaskinian status tuntutan dan pemprosesan kes yang memerlukan tindakan atau penyelarasan antara pejabat dengan bahagian berkaitan."},{"id":"7g","text":"Mengenal pasti serta meneliti penemuan audit berkaitan keselamatan bilik server, kawalan akses pintu utama, kerosakan kemudahan, pertumbuhan kulat, papan tanda korporat dan pengurusan aset pejabat serta menyediakan cadangan tindakan pembetulan dan kawalan risiko."},{"id":"7h","text":"Mengambil perhatian terhadap masalah berulang berkaitan kerosakan penyaman udara, kelembapan ruang pejabat dan keperluan penyelenggaraan premis dengan mengemukakan cadangan penyelesaian serta tindakan susulan kepada pihak yang bertanggungjawab."},{"id":"7i","text":"Memberikan pandangan, tunjuk ajar dan cadangan penyelesaian kepada anggota yang menghadapi masalah teknikal, pengurusan kerja atau ketidakjelasan prosedur supaya tindakan susulan dapat dilaksanakan secara lebih berkesan."},{"id":"7j","text":"Merancang keutamaan kerja dan tindakan penambahbaikan berdasarkan analisis statistik, pencapaian sasaran, maklum balas pelanggan, penemuan audit serta keperluan semasa operasi bagi membantu meningkatkan kecekapan penyampaian perkhidmatan PSP Dungun."},{"id":"7k","text":"Mengamalkan pendekatan penyelesaian masalah melalui semakan fakta, perbincangan, rujukan kepada pegawai berpengalaman dan penilaian alternatif penyelesaian sebelum mengemukakan keputusan atau cadangan yang bersesuaian kepada pihak pengurusan."},{"id":"7l","text":"Mengamalkan pendekatan proaktif dalam mengenal pasti kejadian kemalangan atau musibah yang berpotensi melibatkan Orang Berinsurans melalui maklumat yang diterima daripada media dan sumber berkaitan bagi membantu penyelarasan tindakan awal sebelum permohonan tuntutan dikemukakan."},{"id":"7m","text":"Melaksanakan penilaian semula atau post-mortem terhadap permasalahan operasi yang berlaku di PSP Dungun bagi mengenal pasti punca, meneliti kelemahan proses serta mencadangkan langkah pembetulan dan pencegahan supaya isu yang sama dapat dikurangkan daripada berulang."},{"id":"7n","text":"Meneliti faktor yang mempengaruhi keputusan Orang Bekerja Sendiri untuk mendapatkan perlindungan SKSPS, termasuk aspek kefahaman, kesedaran dan keperluan perlindungan bagi membantu merangka pendekatan advokasi yang lebih berkesan."},{"id":"7o","text":"Menghasilkan aplikasi digital KESPERT Awards 2026 bagi membantu pengurusan paparan keputusan, pencapaian peserta dan penyediaan e-sijil, sekali gus memperkenalkan pendekatan teknologi yang lebih sistematik dalam pelaksanaan program organisasi."},{"id":"7p","text":"Mengambil inisiatif mereka bentuk dan meneroka pembangunan aplikasi pintar bagi membantu proses kerja Unit Faedah dan Pemulihan, termasuk cadangan penambahbaikan semakan dokumen, pemantauan maklumat dan proses membuat rujukan secara lebih berstruktur."},{"id":"7q","text":"Meneliti punca masalah operasi melalui kerjasama anggota di peringkat PSP dan PPN, mengenal pasti kesan risiko terhadap kelancaran perkhidmatan serta mengemukakan penyelesaian yang praktikal berdasarkan tahap keutamaan, sumber dan keperluan tindakan."}]}];

/* V24 music controller. User-provided track; relative M4A beside HTML.
   Browser autoplay can be blocked without a user gesture. A retry is attempted
   automatically on the first interaction without showing a start gate. */
const SPPPA_MUSIC_TARGET=.15;
const SPPPA_MUSIC_FADE_MS=3000;
const spppaAudio=document.getElementById('spppa-bg-music');
let spppaMusicOn=true;
let spppaVideoCount=0;
let spppaFadeFrame=0;
let spppaFadeStart=null;
let spppaFadeFrom=0;
let spppaAutoplayPending=false;
let spppaUserInteracted=false;
const spppaClamp=x=>Math.max(0,Math.min(SPPPA_MUSIC_TARGET,x));
function spppaSyncMusicControl(){
  document.querySelectorAll('[data-music-toggle]').forEach(btn=>{
    btn.setAttribute('aria-pressed',String(spppaMusicOn));
    btn.setAttribute('aria-label',spppaMusicOn?'Muzik latar ON — tekan untuk OFF':'Muzik latar OFF — tekan untuk ON');
  });
}
function spppaCancelFade(){
  if(spppaFadeFrame)cancelAnimationFrame(spppaFadeFrame);
  spppaFadeFrame=0;spppaFadeStart=null;
}
function spppaFadeToTarget(){
  spppaCancelFade();
  spppaFadeFrom=spppaClamp(spppaAudio.volume);
  if(spppaFadeFrom>=SPPPA_MUSIC_TARGET){spppaAudio.volume=SPPPA_MUSIC_TARGET;return}
  const step=ts=>{
    if(!spppaMusicOn||spppaAudio.paused||spppaVideoCount>0)return;
    if(spppaFadeStart===null)spppaFadeStart=ts;
    const p=Math.min(1,(ts-spppaFadeStart)/SPPPA_MUSIC_FADE_MS);
    spppaAudio.volume=spppaFadeFrom+(SPPPA_MUSIC_TARGET-spppaFadeFrom)*p;
    if(p<1)spppaFadeFrame=requestAnimationFrame(step);else spppaFadeFrame=0;
  };
  spppaFadeFrame=requestAnimationFrame(step);
}
async function spppaTryPlay(){
  if(!spppaMusicOn||spppaVideoCount>0)return;
  if(!spppaAudio.paused){spppaAutoplayPending=false;return}
  spppaAudio.volume=0;
  try{
    await spppaAudio.play();
    spppaAutoplayPending=false;
    if(spppaMusicOn&&spppaVideoCount===0)spppaFadeToTarget();
  }catch(error){
    // A browser may reject autoplay until the first real user gesture.
    spppaAutoplayPending=true;
  }
}
function spppaPauseMusic(){spppaCancelFade();spppaAudio.pause()}
document.addEventListener('click',event=>{
  const btn=event.target.closest('[data-music-toggle]');
  if(!btn)return;
  spppaMusicOn=!spppaMusicOn;
  spppaSyncMusicControl();
  if(!spppaMusicOn){spppaAutoplayPending=false;spppaPauseMusic();return}
  // HTMLMediaElement.pause() preserves currentTime, so ON resumes last position.
  spppaTryPlay();
},true);
function spppaOnFirstGesture(event){
  spppaUserInteracted=true;
  if(event.target&&event.target.closest&&event.target.closest('[data-music-toggle]'))return;
  if(spppaMusicOn&&spppaVideoCount===0&&spppaAudio.paused&&spppaAutoplayPending)spppaTryPlay();
}
document.addEventListener('pointerdown',spppaOnFirstGesture,{capture:true,passive:true});
document.addEventListener('keydown',spppaOnFirstGesture,true);
// Capture-based handling also works for dynamically created HTML <video> elements.
const spppaActiveVideos=new WeakSet();
document.addEventListener('play',event=>{
  const v=event.target;
  if(!(v instanceof HTMLVideoElement)||spppaActiveVideos.has(v))return;
  spppaActiveVideos.add(v);spppaVideoCount++;
  spppaPauseMusic();
},true);
function spppaReleaseVideo(v){
  if(!(v instanceof HTMLVideoElement)||!spppaActiveVideos.has(v))return;
  spppaActiveVideos.delete(v);spppaVideoCount=Math.max(0,spppaVideoCount-1);
  if(spppaVideoCount===0&&spppaMusicOn)spppaTryPlay();
